<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pemesanan Abon Sapi Tumbuk Barokah</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #111;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .order-container {
      max-width: 500px;
      margin: 50px auto;
      background-color: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,0,0,0.3);
    }
    h2 {
      color: #ff3333;
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      color: #ddd;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #222;
      color: #fff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #ff3333;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 15px;
      transition: 0.3s;
    }
    button:hover {
      background-color: #ff5555;
    }
    .total {
      text-align: center;
      font-size: 1.2rem;
      margin-top: 15px;
      color: #00ff7f;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="order-container">
    <h2>Form Pemesanan Abon Sapi Tumbuk Barokah</h2>
    <label>Nama Lengkap</label>
    <input type="text" id="nama" placeholder="Masukkan nama anda" required />

    <label>Alamat Lengkap</label>
    <textarea id="alamat" placeholder="Masukkan alamat pengiriman..." required></textarea>

    <label>Pilih Jenis Produk</label>
    <select id="produk" onchange="hitungTotal()">
      <option value="">-- Pilih Produk --</option>
      <option value="10">Abon Sapi 10gr (Rp 4.990)</option>
      <option value="100">Abon Sapi 100gr (Rp 35.999)</option>
    </select>

    <label>Jumlah (pcs)</label>
    <input type="number" id="jumlah" min="1" value="1" oninput="hitungTotal()" />

    <label>Kategori Pemesanan</label>
    <select id="kategori">
      <option value="pembeli">Pembeli Biasa</option>
      <option value="reseller">Reseller</option>
    </select>

    <div class="total" id="total">Total: Rp 0</div>

    <button onclick="kirimPesanan()">Kirim Pesanan via WhatsApp</button>
  </div>

  <script>
    const harga10 = 4990;
    const harga100 = 35999;

    function hitungTotal() {
      const produk = document.getElementById('produk').value;
      const jumlah = document.getElementById('jumlah').value;
      let total = 0;

      if (produk === "10") total = harga10 * jumlah;
      else if (produk === "100") total = harga100 * jumlah;

      document.getElementById('total').textContent = 
        `Total: Rp ${total.toLocaleString('id-ID')}`;
    }

    function kirimPesanan() {
      const nama = document.getElementById('nama').value;
      const alamat = document.getElementById('alamat').value;
      const produk = document.getElementById('produk').value;
      const jumlah = document.getElementById('jumlah').value;
      const kategori = document.getElementById('kategori').value;

      if (!nama || !alamat || !produk || !jumlah) {
        alert("Mohon lengkapi semua data terlebih dahulu!");
        return;
      }

      let namaProduk = produk === "10" ? "Abon Sapi 10gr" : "Abon Sapi 100gr";
      let total = produk === "10" ? harga10 * jumlah : harga100 * jumlah;
      let nomor = kategori === "reseller" ? "6282133079396" : "6285725046201";

      let pesan = `Halo Admin Abon Barokah,%0ASaya ingin memesan:%0A` +
                  `Nama: ${nama}%0A` +
                  `Alamat: ${alamat}%0A` +
                  `Produk: ${namaProduk}%0A` +
                  `Jumlah: ${jumlah} pcs%0A` +
                  `Total: Rp ${total.toLocaleString('id-ID')}`;

      window.open(`https://wa.me/${nomor}?text=${pesan}`, "_blank");
    }
  </script>
</body>
</html>
